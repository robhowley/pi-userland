name: CI - Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_desktop: ${{ steps.classify.outputs.run_desktop }}
      classification_error: ${{ steps.classify.outputs.classification_error }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - id: classify
        run: node .github/scripts/session-deck-ci-classifier.mjs

  package-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Run package lint
        run: pnpm lint

      - name: Run package format check
        run: pnpm format:check

      - name: Run package typecheck
        run: pnpm typecheck

  package-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Test the changed-file classifier
        run: node --test .github/scripts/__tests__/session-deck-ci-classifier.test.mjs

      - name: Run package tests
        run: pnpm test

  desktop-checks:
    needs: classify-impact
    if: ${{ always() && (needs.classify-impact.result != 'success' || needs.classify-impact.outputs.run_desktop != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Verify Session Deck web assets are synchronized
        run: |
          pnpm --filter ./apps/session-deck-desktop sync:web
          git diff --exit-code -- \
            apps/session-deck-desktop/web/index.html \
            apps/session-deck-desktop/web/style.css \
            apps/session-deck-desktop/web/session-deck-ui.js

      - name: Build Session Deck desktop app
        run: pnpm --filter ./apps/session-deck-desktop build

      - name: Run Session Deck desktop lint
        run: pnpm --filter ./apps/session-deck-desktop lint

      - name: Run Session Deck desktop format check
        run: pnpm --filter ./apps/session-deck-desktop format:check

      - name: Run Session Deck desktop typecheck
        run: pnpm --filter ./apps/session-deck-desktop typecheck

  desktop-tests:
    needs: classify-impact
    if: ${{ always() && (needs.classify-impact.result != 'success' || needs.classify-impact.outputs.run_desktop != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Session Deck desktop tests
        run: pnpm --filter ./apps/session-deck-desktop test

  ci-gate:
    name: CI Gate
    needs:
      - classify-impact
      - package-checks
      - package-tests
      - desktop-checks
      - desktop-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CLASSIFIER_RESULT: ${{ needs.classify-impact.result }}
      CLASSIFICATION_ERROR: ${{ needs.classify-impact.outputs.classification_error }}
      PACKAGE_CHECKS_RESULT: ${{ needs.package-checks.result }}
      PACKAGE_TESTS_RESULT: ${{ needs.package-tests.result }}
      RUN_DESKTOP: ${{ needs.classify-impact.outputs.run_desktop }}
      DESKTOP_CHECKS_RESULT: ${{ needs.desktop-checks.result }}
      DESKTOP_TESTS_RESULT: ${{ needs.desktop-tests.result }}
    steps:
      - name: Verify CI results
        shell: bash
        run: |
          set -euo pipefail

          [[ "$CLASSIFIER_RESULT" == success ]]
          [[ "$CLASSIFICATION_ERROR" == false ]]
          [[ "$PACKAGE_CHECKS_RESULT" == success ]]
          [[ "$PACKAGE_TESTS_RESULT" == success ]]

          case "$RUN_DESKTOP:$DESKTOP_CHECKS_RESULT:$DESKTOP_TESTS_RESULT" in
            true:success:success|false:skipped:skipped) ;;
            *) exit 1 ;;
          esac
