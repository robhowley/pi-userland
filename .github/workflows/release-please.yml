name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.releases_created == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11
        if: steps.release.outputs.releases_created == 'true'
        # npm trusted publishing requires npm 11.5.1+ on Node 22.14+.
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Publish changed packages
        if: steps.release.outputs.releases_created == 'true'
        run: |
          echo "Released packages: ${{ steps.release.outputs.paths_released }}"
          echo '${{ steps.release.outputs.paths_released }}' | jq -r '.[]' | while read -r pkg; do
            echo "Publishing $pkg"
            (cd "$pkg" && npm publish)
          done
