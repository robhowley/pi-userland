name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_tags:
        description: 'Existing tags to publish, comma/space separated (e.g. pi-merge-ready-v0.17.0). Blank runs Release Please.'
        required: false
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_tags == ''
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - uses: actions/checkout@v4
        if: steps.release.outputs.releases_created == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.release.outputs.releases_created == 'true'
        with:
          node-version: '22.14'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11
        if: steps.release.outputs.releases_created == 'true'
        # npm trusted publishing requires npm 11.5.1+ on Node 22.14+.
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        if: steps.release.outputs.releases_created == 'true'
        run: pnpm -r --filter './packages/*' --if-present build

      - name: Publish changed packages
        if: steps.release.outputs.releases_created == 'true'
        run: |
          echo "Released packages: ${{ steps.release.outputs.paths_released }}"
          echo '${{ steps.release.outputs.paths_released }}' | jq -r '.[]' | (
            failed_packages=()
            while IFS= read -r pkg; do
              echo "Publishing $pkg"
              if ! (cd "$pkg" && npm publish); then
                failed_packages+=("$pkg")
              fi
            done

            if ((${#failed_packages[@]} > 0)); then
              echo "Failed to publish packages:"
              printf '  %s\n' "${failed_packages[@]}"
              exit 1
            fi
          )

  recover:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_tags != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11
        # Same trusted publishing identity as the normal release job.
        run: npm install -g npm@11

      - name: Publish selected existing releases
        # Stable tags only, one per package. Already published versions are skipped.
        # Package-level npm 404s fail closed; new packages need separate bootstrap.
        env:
          RECOVERY_TAGS: ${{ inputs.recovery_tags }}
        run: node scripts/recover-release.mjs
